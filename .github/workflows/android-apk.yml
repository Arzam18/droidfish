name: Build DroidFish CET Tournament APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DroidFishApp/**'
      - 'CuckooChessEngine/**'
      - 'CuckooChess/**'
      - 'EngineServer/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

env:
  ANDROID_COMPILE_SDK: '28'
  ANDROID_BUILD_TOOLS: '28.0.3'
  ANDROID_NDK_VERSION: '21.4.7075529'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Gradle and wrapper distribution
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3

      - name: Install required SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}"

      # The wrapper's distributionUrl is Gradle 7.2. This command deliberately
      # downloads and validates the exact distribution before the Android build.
      - name: Download and verify Gradle 7.2 distribution
        run: ./gradlew --no-daemon --version

      - name: Run unit tests
        run: ./gradlew --no-daemon :DroidFishApp:testDebugUnitTest

      - name: Build signed, installable debug APK
        run: ./gradlew --no-daemon :DroidFishApp:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: droidfish-cet-tournament-apk
          path: DroidFishApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
