name: Build DroidFishTournament v1.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # sdkmanager from Android Command-line Tools 16 requires JDK 17+.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' SDK package no longer exists. Install only current tools.
          packages: 'platform-tools'

      - name: Build debug APK
        working-directory: src
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidFishTournament-v1.0-debug-apk
          path: src/DroidFishApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
